# Jekyll configuration for Just the Docs on GitHub Pages
title: "AS1"
description: "Advanced Shooter System (TPS + FPS) — Third & First Person • PC & Android"

# Using remote_theme for GitHub Pages compatibility
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

url: "https://decnet-games.github.io"
baseurl: "/AS1-DOC"

# Color scheme
color_scheme: "dark"

# Search configuration
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false

# Navigation structure
nav_sort: nav_order

# Heading anchors
heading_anchors: true

# Auxiliary Links (top right)
aux_links:
  "GitHub Repository": "https://github.com/DecNet-Games/AS1-DOC"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: "Copyright &copy; 2026 Decnet Games. AS1 — Advanced Shooter System. All rights reserved."

# Callouts configuration
callouts:
  note:
    title: Note
    color: purple
  tip:
    title: Pro Tip
    color: green
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: blue
